<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1428"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='12' fill='%230b1428' stroke='%23d8b84f'/%3E%3Ctext x='24' y='32' text-anchor='middle' font-family='Georgia,serif' font-size='28' fill='%23d8b84f'%3EH%3C/text%3E%3C/svg%3E">
  <title>Hero · Map practice</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root{color-scheme:dark;--navy:#0b1428;--panel:#111f38;--line:#293a55;--gold:#d8b84f;--paper:#f1ead8;--muted:#a8b3c5;--blue:#203e70}
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}body{min-height:100vh;padding:18px;color:var(--paper);background:var(--navy);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    .app{width:min(1200px,100%);min-height:calc(100vh - 36px);margin:auto;display:grid;grid-template-rows:auto auto minmax(360px,1fr) auto;gap:12px}
    header,.prompt,.map-wrap,footer{border:1px solid var(--line);border-radius:18px;background:var(--panel)}
    header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px}
    .brand{display:flex;align-items:center;gap:10px;font:700 18px Georgia,serif;letter-spacing:.04em}.mark{display:grid;width:34px;height:34px;place-items:center;border:1px solid #d8b84f88;border-radius:11px;color:var(--gold);font-size:21px}
    .header-note{color:var(--muted);font-size:12px}
    .prompt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px}
    .prompt-copy{min-width:0}.kicker{margin:0 0 3px;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
    h1{margin:0;font:600 clamp(20px,4vw,27px)/1.15 Georgia,serif}.status{min-height:22px;margin:4px 0 0;color:var(--muted);font-size:12px}
    .stats{display:flex;align-items:center;gap:10px;flex-shrink:0}.stat{min-width:76px;text-align:right}.stat small{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.stat b{font:700 20px/1.15 Georgia,serif;color:var(--gold);font-variant-numeric:tabular-nums}
    .map-wrap{position:relative;min-height:360px;overflow:hidden}.map{position:absolute;inset:0;background:#15243b}
    .map-help{position:absolute;z-index:500;left:12px;bottom:12px;padding:7px 10px;border:1px solid #d8b84f55;border-radius:10px;color:var(--paper);background:#0b1428e8;font-size:11px;pointer-events:none}
    footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;color:var(--muted);font-size:11px}
    button{min-height:42px;padding:8px 14px;border:1px solid #d8b84f88;border-radius:12px;color:var(--paper);background:var(--blue);font:700 13px system-ui,sans-serif;cursor:pointer;transition:background .16s,border-color .16s}button:hover:not(:disabled){border-color:var(--gold);background:#2b4a7a}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{opacity:.55;cursor:default}
    .marker{width:14px;height:14px;border:2px solid #f1ead8;border-radius:50%;background:#314d78;box-shadow:0 1px 6px #000a;transition:transform .15s,background .15s,border-color .15s}.leaflet-marker-icon:hover .marker{transform:scale(1.2);border-color:var(--gold);background:var(--gold)}.marker.solved{border-color:#fff1bb;background:var(--gold);box-shadow:0 0 0 4px #d8b84f35,0 1px 6px #000a}
    .leaflet-container{font:inherit}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-zoom a{color:#24344d!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{color:var(--paper);background:#111f38}.leaflet-popup-content{font-weight:650}
    .error{padding:18px;color:#f2c4b6;text-align:center}
    @media(max-width:640px){body{padding:8px}.app{min-height:calc(100dvh - 16px);grid-template-rows:auto auto minmax(380px,1fr) auto;gap:8px}header,.prompt,.map-wrap,footer{border-radius:14px}.header-note{display:none}.prompt{align-items:flex-start;padding:12px}.stats{gap:6px}.stat{min-width:56px}.stat b{font-size:17px}.map-help{left:8px;bottom:8px;font-size:10px}footer{padding:8px 10px;font-size:10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand"><span class="mark">H</span><span>Hero</span></div><span class="header-note">Map practice · a lighter version while the main site is being worked on</span></header>
    <section class="prompt" aria-live="polite"><div class="prompt-copy"><p class="kicker" id="round-label">Map practice</p><h1 id="question">Loading locations…</h1><p id="status" class="status">Opening the atlas.</p></div><div class="stats"><div class="stat"><small>Found</small><b id="found">0 / 0</b></div><button id="next" type="button" hidden>Next place</button></div></section>
    <section class="map-wrap" aria-label="Interactive location map"><div id="map" class="map"></div><div class="map-help">Tap a dot to find the place · hover to preview its border</div></section>
    <footer><span id="source-note">Locations and borders from Hero.</span><a href="/" style="color:inherit;text-decoration-color:#d8b84f88;text-underline-offset:3px">Back to the main site</a></footer>
  </main>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
  <script src="js/02-firebase-config.js?v=bbbd2562149e86ed"></script>
  <script src="js/00-site-config.js?v=2bddae86bc0551c3"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="js/hero-fallback.js?v=5de9336cfcdef8fb"></script>
</body>
</html>
