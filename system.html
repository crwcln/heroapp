<!doctype html>
<html lang="en" class="dark" data-theme="cairn" data-bg="mesh" data-font="editorial" data-motion="on">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="referrer" content="no-referrer">
    <title>Hero · System Console</title>
    <meta name="theme-color" content="#1e3a6e">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@600;700;800&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=b3d02209b543645c">
    <link rel="stylesheet" href="css/premium.css?v=cb07fb1ff0c14a81">
    <link rel="stylesheet" href="css/night.css?v=180fda0ee1596dc4">
    <link rel="stylesheet" href="css/tailwind.css?v=1715611269576323">
    <link rel="stylesheet" href="css/design-system.css?v=aba15f49d8c82e11">
    <link rel="stylesheet" href="css/system-console.css?v=9745e32fca868f34">
    <style>
        .sc-shell { max-width: 1100px; margin-inline: auto; padding-inline: 24px; }
        .sc-button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-600); outline-offset: 2px; }
        html.dark .sc-button:focus-visible, html.dark input:focus-visible { outline-color: var(--sec); }
        .sc-button:hover:not(:disabled) { border-color: var(--sec); background: var(--brand-600); color: var(--sc-on-brand); }
        .sc-button:active:not(:disabled) { background: var(--sec); color: var(--sc-on-gold); }
        .sc-button:disabled { opacity: .56; cursor: wait; }
        input:hover:not(:disabled) { border-color: color-mix(in srgb, var(--sec) 55%, transparent); }
        input:active:not(:disabled) { border-color: var(--brand-600); }
        input:disabled { opacity: .56; cursor: not-allowed; }
    </style>
</head>
<body>
    <main class="sc-shell" style="max-width:1100px;margin-inline:auto;padding-inline:24px">
        <header class="sc-topbar">
            <div class="sc-brand">
                <span class="sc-mark" aria-hidden="true"><i></i></span>
                <div>
                    <span class="sc-kicker">Hero operations</span>
                    <h1>System Console</h1>
                </div>
            </div>
            <button id="sc-lock" class="sc-button sc-button-quiet" type="button" hidden>Lock</button>
        </header>
        <section id="sc-gate" class="sc-card sc-gate" aria-labelledby="sc-gate-title">
            <span class="sc-kicker">Restricted</span>
            <h2 id="sc-gate-title">System access</h2>
            <p>Use the separate system passphrase. Steward and developer passwords do not unlock this console.</p>
            <form id="sc-form" autocomplete="off">
                <label for="sc-password">System passphrase</label>
                <div class="sc-input-row">
                    <input id="sc-password" name="password" type="password" autocomplete="current-password" required minlength="1">
                    <button id="sc-unlock" class="sc-button" type="submit">Unlock</button>
                </div>
            </form>
            <p id="sc-auth-error" class="sc-message" role="alert" hidden></p>
        </section>
        <section id="sc-console" class="sc-console" aria-labelledby="sc-console-title" hidden>
            <div class="sc-summary-row">
                <div>
                    <span class="sc-kicker">Configuration health</span>
                    <h2 id="sc-console-title">Services</h2>
                </div>
                <button id="sc-refresh" class="sc-button" type="button">Refresh</button>
            </div>
            <div id="sc-summary" class="sc-summary" role="status" aria-live="polite">Checking…</div>
            <div id="sc-groups" class="sc-grid"></div>
            <p id="sc-status" class="sc-note" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="js/system-console.js?v=65e4bf8f8818d0f7"></script>
</body>
</html>
